<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- localsend-nas mark v3: solid NAS square inside a dashed
       rounded-square ring — LocalSend's "dot + dashed ring" motif,
       squared. Style derived from the LocalSend logo (© Tien Do Nam,
       Apache-2.0). -->
  <rect width="512" height="512" rx="112" fill="#008080"/>
  <!-- ring: dashed rounded-square outline; 8 dashes centered on
       sides + corners (period = perimeter/8 ≈ 180.5) -->
  <rect x="60" y="60" width="392" height="392" rx="72" fill="none"
        stroke="#ffffff" stroke-width="40"
        stroke-dasharray="115 65.5" stroke-dashoffset="-66.5"
        stroke-linecap="round"/>
  <!-- center: the NAS -->
  <rect x="149" y="149" width="214" height="214" rx="46" fill="#ffffff"/>
</svg>
